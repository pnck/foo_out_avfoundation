name: Build All

on:
  push:
    branches: ['main', 'dev', 'dev/*']

  pull_request:
    branches: ['main']

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build-macos:
    name: Build
    # macos-latest is an Apple-silicon runner, which matches the arm64-only build
    # (macOS Spatial Audio is Apple-silicon only, so no Intel slice is produced).
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-tags: true
          fetch-depth: 0

      # Command Line Tools ship clang + the macOS SDK; Xcode.app is not required.
      # Ninja makes the CMake build fast and fully IDE-free.
      - name: Install Ninja
        run: brew install ninja

      - name: Decide signing
        id: sign
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          # Release + TEAM_ID set -> import the cert and sign for real; otherwise (and always for
          # Debug) ad-hoc ("-"). Never "" — that makes CMake skip codesign and ship it unsigned.
          if [ "${{ matrix.config }}" = "Release" ] && [ -n "$TEAM_ID" ]; then
            echo "has_cert=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_cert=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Import Certificate
        if: steps.sign.outputs.has_cert == 'true'
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.CERTIFICATES_P12_B64 }}
          p12-password: ${{ secrets.CERTIFICATES_P12_PASSWORD }}

      - name: Resolve signing identity
        id: ident
        run: |
          # `codesign -s` matches a cert's common name / SHA-1, NOT a bare Team ID. So pull the
          # actual identity SHA-1 out of the keychain the cert was just imported into — unambiguous
          # (the temp keychain holds only our cert) and survives yearly cert renewals. No cert -> "-".
          if [ "${{ steps.sign.outputs.has_cert }}" = "true" ]; then
            HASH=$(security find-identity -v -p codesigning | awk 'NR==1{print $2}')
            if [ -z "$HASH" ]; then
              echo "::error::TEAM_ID is set but no code-signing identity was found after import." >&2
              exit 1
            fi
            echo "identity=$HASH" >> "$GITHUB_OUTPUT"
          else
            echo "identity=-" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure
        run: |
          # Version string is derived inside CMakeLists (Debug -> +git hash, Release -> tag).
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
            -DCODESIGN_IDENTITY="${{ steps.ident.outputs.identity }}"

      - name: Build
        run: cmake --build build --parallel

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: foo_out_avfoundation-macos-${{ matrix.config }}
          path: ${{ github.workspace }}/dist
          if-no-files-found: error
