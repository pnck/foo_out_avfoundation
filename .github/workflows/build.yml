name: Build All

on:
  push:
    branches: ['main', 'dev', 'dev/*']

  pull_request:
    branches: ['main']

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build-macos:
    name: Build
    # macos-latest is an Apple-silicon runner, which matches the arm64-only build
    # (macOS Spatial Audio is Apple-silicon only, so no Intel slice is produced).
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-tags: true
          fetch-depth: 0

      # Command Line Tools ship clang + the macOS SDK; Xcode.app is not required.
      # Ninja makes the CMake build fast and fully IDE-free.
      - name: Install Ninja
        run: brew install ninja

      - name: Derive version
        id: ver
        run: |
          TAG=$(git describe --long --all 2>/dev/null || echo "0.1.0")
          VERSION=${TAG:6}
          [ -z "$VERSION" ] && VERSION=0.1.0
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

      - name: Import Certificate
        if: matrix.config == 'Release'
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.CERTIFICATES_P12_B64 }}
          p12-password: ${{ secrets.CERTIFICATES_P12_PASSWORD }}

      - name: Configure
        run: |
          # Release -> sign with the imported identity; Debug -> ad-hoc ("-").
          if [ "${{ matrix.config }}" = "Release" ]; then
            SIGN_ID="${{ secrets.TEAM_ID }}"
          else
            SIGN_ID="-"
          fi
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
            -DFB2K_VERSION="${{ steps.ver.outputs.version }}" \
            -DCODESIGN_IDENTITY="$SIGN_ID"

      - name: Build
        run: cmake --build build --parallel

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: foo_out_avfoundation-macos-${{ matrix.config }}
          path: ${{ github.workspace }}/dist
          if-no-files-found: error
